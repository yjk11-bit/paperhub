<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PaperHub 高中精品试卷库{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100">
  <header class="bg-white shadow">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <a href="{{ url_for('index') }}" class="text-lg font-bold text-gray-800 hover:text-blue-600">PaperHub 高中精品试卷库</a>
        <nav class="text-sm text-gray-600 flex items-center gap-3 flex-wrap">
          <span>{{ username }}</span>
          <a href="{{ url_for('index') }}" class="text-blue-600 hover:underline">题库</a>
          <a href="{{ url_for('my_collects') }}" class="text-blue-600 hover:underline">我的收藏</a>
          <a href="{{ url_for('browsing_history') }}" class="text-blue-600 hover:underline">浏览历史</a>
          <a href="{{ url_for('profile') }}" class="text-blue-600 hover:underline">个人中心</a>
          {% if is_admin %}<a href="{{ url_for('admin_pending') }}" class="text-amber-600 hover:underline">审核面板</a>{% endif %}
          <a href="{{ url_for('logout') }}" class="text-blue-600 hover:underline">退出登录</a>
        </nav>
      </div>
      <!-- 顶部标题搜索框：全站任意页面可直接搜索，跳转题库展示结果 -->
      <form method="get" action="{{ url_for('index') }}" class="mt-3 flex gap-2">
        <input type="text" name="keyword" value="{{ keyword|default('') }}" placeholder="搜索试卷标题…"
               class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded px-4 py-2 text-sm">搜索</button>
      </form>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
