<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - PaperHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="w-full max-w-sm bg-white rounded-lg shadow p-8">
    <h1 class="text-2xl font-bold text-center mb-6">注册 PaperHub 账号</h1>
    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded px-4 py-2">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input type="password" id="password" name="password" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded py-2 text-sm font-medium">注册</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-500">已有账号？<a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">去登录</a></p>
  </div>
</body>
</html>
